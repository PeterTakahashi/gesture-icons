<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gesture-icons — pure CSS versions</title>
<style>
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: #e9e9e7; color: #1a1a1a;
    display: flex; gap: 24px; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
  }
  .tile {
    width: 140px; height: 110px; background: #fff; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; font-size: 13px; color: #6e6e6e;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .tile svg { color: #2b2b2b; }

  /* ── bell: it rings ─────────────────────────────────────────────────────
     The gesture fires on [data-go] OR hover; JS may set data-go after a
     dwell and clear it on animationend so a started ring always finishes.
     Pure hover works too — it is just cancellable. */
  .gi-bell .bell-all {
    transform-origin: 12px 3px;   /* the loop it hangs from */
    transform-box: view-box;
  }
  .gi-bell .bell-clapper { transform-origin: 12px 17.5px; transform-box: view-box; }
  .tile:hover .gi-bell .bell-all,
  [data-go] .gi-bell .bell-all { animation: gi-bell-swing 1.05s both; }
  .tile:hover .gi-bell .bell-clapper,
  [data-go] .gi-bell .bell-clapper { animation: gi-bell-clap 1.05s both; }
  @keyframes gi-bell-swing {
    0% { transform: rotate(0deg); } 16% { transform: rotate(-13deg); }
    36% { transform: rotate(11deg); } 54% { transform: rotate(-7deg); }
    70% { transform: rotate(4deg); } 86% { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes gi-bell-clap {
    0% { transform: rotate(0deg); } 20% { transform: rotate(10deg); }
    40% { transform: rotate(-9deg); } 58% { transform: rotate(6deg); }
    74% { transform: rotate(-3deg); } 88% { transform: rotate(1deg); }
    100% { transform: rotate(0deg); }
  }

  /* ── heart: it beats, lub-dub ─────────────────────────────────────────── */
  .gi-heart path {
    transform-origin: 12px 12.5px;
    transform-box: view-box;
  }
  .tile:hover .gi-heart path,
  [data-go] .gi-heart path { animation: gi-heart-beat 0.95s both; }
  @keyframes gi-heart-beat {
    0% { transform: scale(1); }
    12% { transform: scale(1.12); }   /* lub */
    26% { transform: scale(1.02); }
    42% { transform: scale(1.22); }   /* DUB */
    62% { transform: scale(0.99); }
    100% { transform: scale(1); }     /* diastole */
  }

  @media (prefers-reduced-motion: reduce) {
    .tile * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="tile">
    <svg class="gi-bell" width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g class="bell-all">
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
        <path class="bell-clapper" d="M10.268 21a2 2 0 0 0 3.464 0" />
      </g>
    </svg>
    bell
  </div>
  <div class="tile">
    <svg class="gi-heart" width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />
    </svg>
    heart
  </div>
</body>
</html>
